<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator | Neumorphic Web Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calc-box">
        <div id="calcDisplay" class="calc-display">0</div>
        <div class="calc-keys">
            <button class="key op" onclick="clearCalc()">C</button>
            <button class="key op" onclick="appendOperator('/')">&divide;</button>
            <button class="key op" onclick="appendOperator('*')">&times;</button>
            <button class="key op" onclick="deleteLast()">&larr;</button>
            
            <button class="key" onclick="appendNum('7')">7</button>
            <button class="key" onclick="appendNum('8')">8</button>
            <button class="key" onclick="appendNum('9')">9</button>
            <button class="key op" onclick="appendOperator('-')">&minus;</button>
            
            <button class="key" onclick="appendNum('4')">4</button>
            <button class="key" onclick="appendNum('5')">5</button>
            <button class="key" onclick="appendNum('6')">6</button>
            <button class="key op" onclick="appendOperator('+')">+</button>
            
            <button class="key" onclick="appendNum('1')">1</button>
            <button class="key" onclick="appendNum('2')">2</button>
            <button class="key" onclick="appendNum('3')">3</button>
            <button class="key eq" onclick="calculateResult()">=</button>
            
            <button class="key zero" onclick="appendNum('0')">0</button>
            <button class="key" onclick="appendNum('.')">.</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
