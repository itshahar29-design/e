<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ob-Havo Ilovasi | Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="weather-card">
        <div class="search-bar">
            <input type="text" id="cityInput" placeholder="Shahar kiriting (masalan: Toshkent)..." value="Toshkent">
            <button onclick="getWeatherData()"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="weather-info">
            <div id="weatherIcon" class="weather-icon">☀️</div>
            <h1 id="tempDisplay">24°C</h1>
            <h2 id="cityName">Toshkent, O'zbekiston</h2>
            <p id="weatherDesc">Quyoshli va musaffo osmon</p>
        </div>
        <div class="weather-details">
            <div class="col">
                <i class="fa-solid fa-water"></i>
                <div><strong id="humidity">42%</strong><p>Namlik</p></div>
            </div>
            <div class="col">
                <i class="fa-solid fa-wind"></i>
                <div><strong id="windSpeed">14 km/soat</strong><p>Shamol</p></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
