<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sekundomer va Soat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2 id="clockHeader">00:00:00</h2>
        <div class="stopwatch-display" id="swDisplay">00:00:00.00</div>
        <div class="btns">
            <button id="startBtn" onclick="toggleStopwatch()">Boshlash</button>
            <button onclick="recordLap()">Aylana (Lap)</button>
            <button onclick="resetStopwatch()">Qaytarish</button>
        </div>
        <ul id="lapsList" class="laps"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
