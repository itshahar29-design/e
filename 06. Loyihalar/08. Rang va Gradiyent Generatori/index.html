<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>🎨 CSS Gradiyent Generator</h2>
        <div id="previewBox" class="preview-box"></div>
        <div class="controls">
            <div>
                <label>1-Rang:</label>
                <input type="color" id="col1" value="#0ea5e9" oninput="updateGrad()">
            </div>
            <div>
                <label>2-Rang:</label>
                <input type="color" id="col2" value="#a855f7" oninput="updateGrad()">
            </div>
            <div>
                <label>Burchak: <span id="degVal">135°</span></label>
                <input type="range" id="degSlider" min="0" max="360" value="135" oninput="updateGrad()">
            </div>
        </div>
        <div class="code-box">
            <input type="text" id="cssCodeOutput" readonly>
            <button onclick="copyCode()">Kodni Nusxalash</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
