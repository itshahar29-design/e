<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore | Onlayn Do'kon</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo"><i class="fa-solid fa-bag-shopping"></i> TechStore</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Mahsulotlarni qidiring..." oninput="filterProducts()">
        </div>
        <button class="cart-btn" onclick="toggleCartDrawer()">
            <i class="fa-solid fa-cart-shopping"></i> Savatcha (<span id="cartCount">0</span>)
        </button>
    </header>

    <main class="container">
        <h2 style="margin: 20px 0; color: #38bdf8;">Barcha Mahsulotlar</h2>
        <div id="productsGrid" class="products-grid"></div>
    </main>

    <!-- CART DRAWER -->
    <div id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Savatchangiz</h3>
            <button class="close-btn" onclick="toggleCartDrawer()">&times;</button>
        </div>
        <div id="cartItemsList" class="cart-items">Savatchangiz bo'sh</div>
        <div class="cart-footer">
            <div class="total-row"><span>Jami:</span><strong id="cartTotalSum">$0.00</strong></div>
            <button class="checkout-btn" onclick="checkoutOrder()">Buyurtma Berish</button>
        </div>
    </div>
    <div id="cartOverlay" class="cart-overlay" onclick="toggleCartDrawer()"></div>

    <script src="script.js"></script>
</body>
</html>
