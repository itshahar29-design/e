<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xavfsiz Parol Generatori</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="card">
        <h2>🔒 Parol Generatori</h2>
        <div class="display-row">
            <input type="text" id="passDisplay" readonly value="Kodni bosing...">
            <button onclick="copyPassword()"><i class="fa-solid fa-copy"></i></button>
        </div>
        <div class="setting-row">
            <label>Uzunlik: <span id="lenVal">16</span></label>
            <input type="range" id="passLen" min="6" max="32" value="16" oninput="updateLen()">
        </div>
        <div class="options">
            <label><input type="checkbox" id="incUpper" checked> Katta harflar (A-Z)</label>
            <label><input type="checkbox" id="incLower" checked> Kichik harflar (a-z)</label>
            <label><input type="checkbox" id="incNum" checked> Raqamlar (0-9)</label>
            <label><input type="checkbox" id="incSym" checked> Belgilar (!@#$%)</label>
        </div>
        <button class="generate-btn" onclick="generatePass()">Yangi Parol Yaratish</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
