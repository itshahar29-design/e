<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <div id="quizHeader" class="quiz-header">
            <h2>🧠 Frontend Dasturchi Viktorinasi</h2>
            <div id="questionNumber" class="q-number">1 / 5-savol</div>
        </div>
        <div id="questionBody" class="quiz-body">
            <h3 id="questionText">Savol yuklanmoqda...</h3>
            <div id="optionsList" class="options-list"></div>
        </div>
        <div id="resultScreen" class="result-screen" style="display:none;">
            <h2>🎉 Viktorina Yakunlandi!</h2>
            <p id="scoreText">Sizning natijangiz: 5 dan 5</p>
            <button class="restart-btn" onclick="restartQuiz()">Qaytadan Boshlash</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
