<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiqa Pleyeri</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="player-card">
        <div id="diskCover" class="disk-cover">🎵</div>
        <h3 id="trackTitle">Frontend Beat</h3>
        <p id="artistName">Lofi Coding Vibes</p>
        <div class="progress-container" onclick="seekTrack(event)">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="time-row">
            <span id="currTime">0:00</span>
            <span id="durTime">3:45</span>
        </div>
        <div class="controls">
            <button onclick="prevTrack()"><i class="fa-solid fa-backward-step"></i></button>
            <button id="playBtn" class="play-main" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
            <button onclick="nextTrack()"><i class="fa-solid fa-forward-step"></i></button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
