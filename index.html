<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front-End Darslari Portali | Fayozbek Hamidov (10X Versiya)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-sidebar: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #1e293b;
            --success: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        #sidebar {
            width: 360px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .brand-header {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.4);
        }
        .brand-info h2 { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .brand-info p { font-size: 12px; color: var(--accent); font-weight: 600; }

        /* SEARCH & PILLS */
        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .search-input-wrapper {
            position: relative;
        }
        .search-input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }
        .search-input {
            width: 100%;
            padding: 10px 10px 10px 36px;
            background: #090d16;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: var(--accent); }

        /* MODULE PILLS */
        .module-pills {
            display: flex;
            gap: 6px;
            padding: 8px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.5);
        }
        .module-pills::-webkit-scrollbar { height: 4px; }
        .module-pills::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
        .pill-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pill-btn:hover { background: #334155; color: #fff; }
        .pill-btn.active { background: #0284c7; color: #fff; border-color: #38bdf8; }

        .progress-bar-container {
            padding: 10px 16px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
        }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .progress-track {
            height: 6px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            width: 0%;
            transition: width 0.3s;
        }

        /* MODULES & LESSONS LIST */
        .lessons-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .lessons-tree::-webkit-scrollbar { width: 6px; }
        .lessons-tree::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

        .module-group { margin-bottom: 8px; }
        .module-header {
            padding: 10px 12px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .module-header:hover { background: rgba(51, 65, 85, 0.6); border-color: #334155; }
        .module-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .module-badge {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: var(--accent);
            border: 1px solid #334155;
        }
        .chevron { transition: transform 0.3s; font-size: 12px; }
        .chevron.open { transform: rotate(90deg); }

        .lesson-list { list-style: none; padding-left: 8px; margin-top: 4px; display: none; }
        .lesson-list.open { display: block; }
        .lesson-item {
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 2px;
            transition: all 0.2s;
        }
        .lesson-item:hover { background: #1e293b; color: #fff; }
        .lesson-item.active { background: #0284c7; color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.4); }
        .lesson-item input[type="checkbox"] { cursor: pointer; accent-color: var(--success); transform: scale(1.15); }
        .lesson-item span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* SIDEBAR FOOTER STATS */
        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #090d16;
        }

        /* MAIN CONTENT AREA */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-dark);
            overflow: hidden;
        }

        /* NAVBAR */
        .top-navbar {
            height: 65px;
            background: var(--bg-sidebar);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .current-lesson-info h1 { font-size: 16px; font-weight: 700; color: #ffffff; }
        .current-lesson-info p { font-size: 12px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .actions-bar { display: flex; align-items: center; gap: 8px; }
        .btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 7px 13px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn:hover { background: #334155; }
        .btn.primary { background: #0284c7; border-color: #38bdf8; }
        .btn.primary:hover { background: #0369a1; }
        .btn.success { background: #065f46; border-color: #10b981; color: #34d399; }
        .btn.success:hover { background: #047857; }

        /* WORKSPACE & TABS */
        .tab-bar {
            background: #090d16;
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            gap: 4px;
        }
        .tab-btn {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #fff; }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(56, 189, 248, 0.05); }

        .preview-wrapper {
            flex: 1;
            position: relative;
            background: #0f172a;
            display: flex;
            overflow: hidden;
        }
        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        #code-viewer {
            flex: 1;
            display: none;
            background: #050811;
            color: #cdd6f4;
            padding: 20px;
            overflow: auto;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        #code-viewer.active { display: block; }

        /* LIVE PLAYGROUND TAB */
        #playground-view {
            flex: 1;
            display: none;
            flex-direction: column;
            background: #090d16;
            padding: 16px;
            gap: 12px;
        }
        #playground-view.active { display: flex; }
        .playground-editor {
            flex: 1;
            width: 100%;
            background: #050811;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #38bdf8;
            font-family: 'Fira Code', monospace;
            padding: 14px;
            font-size: 13px;
            outline: none;
            resize: none;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside id="sidebar">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div class="brand-info">
                <h2>FRONT-END 10X PORTAL</h2>
                <p>Masterclass Darsliklar Tizimi</p>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
            <div class="search-input-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Darslarni qidirish (loop, modal, flex, react)...">
            </div>
        </div>

        <!-- MODULE QUICK PILLS -->
        <div class="module-pills" id="module-pills">
            <button class="pill-btn active" onclick="filterByModule('all')">Hammasi (178)</button>
            <button class="pill-btn" onclick="filterByModule('01. HTML')">HTML (8)</button>
            <button class="pill-btn" onclick="filterByModule('02. CSS')">CSS (10)</button>
            <button class="pill-btn" onclick="filterByModule('03. JS')">JS (30)</button>
            <button class="pill-btn" onclick="filterByModule('04. Advanced JavaScript')">Adv JS (26)</button>
            <button class="pill-btn" onclick="filterByModule('05. React')">React (4)</button>
            <button class="pill-btn" onclick="filterByModule('06. Loyihalar')"><i class="fa-solid fa-rocket"></i> Loyihalar (100)</button>
        </div>

        <!-- PROGRESS -->
        <div class="progress-bar-container">
            <div class="progress-text">
                <span>O'zlashtirish darajasi:</span>
                <span id="progress-percent" style="font-weight: 700; color: #34d399;">0%</span>
            </div>
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <!-- LESSONS TREE -->
        <div class="lessons-tree" id="lessons-tree">
            <!-- Dynamically populated by portal.js -->
        </div>

        <!-- SIDEBAR FOOTER STATS -->
        <div class="sidebar-footer">
            <span><i class="fa-solid fa-book-open"></i> Jami: <strong>178 ta dars & loyiha (100 ta Loyiha!)</strong></span>
            <span><i class="fa-solid fa-cloud-arrow-up" style="color: #38bdf8;"></i> Render Tayyor</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content">
        <!-- TOP NAVBAR -->
        <header class="top-navbar">
            <div class="current-lesson-info">
                <h1 id="lesson-title">Bosh sahifa</h1>
                <p id="lesson-module"><i class="fa-solid fa-graduation-cap"></i> Front-End Platformasiga xush kelibsiz!</p>
            </div>

            <div class="actions-bar">
                <button class="btn success" id="download-zip-btn" onclick="downloadCurrentLessonZip()" title="Ushbu loyiha yoki dars kodlarini ZIP holatida yuklab olish"><i class="fa-solid fa-file-zipper"></i> ZIP Yuklab Olish</button>
                <button class="btn" id="mark-done-btn" onclick="toggleCurrentCompleted()"><i class="fa-regular fa-circle-check"></i> Tugatildi</button>
                <button class="btn" id="prev-btn" title="Oldingi dars (←)"><i class="fa-solid fa-arrow-left"></i> Oldingi</button>
                <button class="btn" id="next-btn" title="Keyingi dars (→)">Keyingi <i class="fa-solid fa-arrow-right"></i></button>
                <button class="btn" id="fullscreen-btn" onclick="toggleFullscreen()" title="To'liq ekran"><i class="fa-solid fa-expand"></i></button>
                <button class="btn primary" id="open-new-tab" title="Yangi oynada ochish"><i class="fa-solid fa-arrow-up-right-from-square"></i></button>
            </div>
        </header>

        <!-- TABS -->
        <div class="tab-bar">
            <button class="tab-btn active" id="tab-preview-btn"><i class="fa-solid fa-desktop"></i> Jonli Natija (Live Preview)</button>
            <button class="tab-btn" id="tab-code-btn"><i class="fa-solid fa-code"></i> Kodni Ko'rish (Source Code)</button>
            <button class="tab-btn" id="tab-playground-btn"><i class="fa-solid fa-flask"></i> Jonli Tahrirlash (Live Editor)</button>
        </div>

        <!-- WORKSPACE -->
        <div class="preview-wrapper">
            <iframe id="preview-frame" src=""></iframe>
            <pre id="code-viewer"></pre>
            <div id="playground-view">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #94a3b8; font-size: 0.9rem; font-weight: bold;"><i class="fa-solid fa-pen-to-square"></i> Kodni Tahrirlang va Sinang:</span>
                    <button class="btn primary" onclick="runPlaygroundCode()"><i class="fa-solid fa-play"></i> ▶️ Kodni Ishga Tushirish</button>
                </div>
                <textarea id="playground-editor" class="playground-editor" spellcheck="false"></textarea>
            </div>
        </div>
    </main>

    <!-- JSZip & FileSaver for 1-Click Browser ZIP Downloads -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="./portal.js"></script>
</body>
</html>
